<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自動同步隨機抽籤系統</title>
    <!-- SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 強制單頁鎖死，禁止任何捲動 */
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-[100dvh] flex flex-col items-center justify-center p-4 sm:p-8">

    <div class="bg-gray-800 border border-gray-700 shadow-2xl rounded-3xl p-6 sm:p-10 w-full max-w-2xl flex flex-col justify-between max-h-[94vh]">
        
        <!-- 標題 -->
        <h1 class="text-3xl sm:text-4xl font-extrabold text-center text-indigo-400 mb-6 sm:mb-8 tracking-wide">📦 隨機抽籤系統</h1>

        <!-- 選擇 JSON 檔案下拉選單 -->
        <div class="mb-5 sm:mb-8">
            <label for="jsonSelect" class="block text-sm sm:text-base font-semibold text-gray-300 mb-2">選擇抽選清單：</label>
            <select id="jsonSelect" class="w-full bg-gray-900 border border-gray-600 rounded-2xl p-4 sm:p-5 text-base sm:text-lg text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                <option value="">載入清單中...</option>
            </select>
        </div>

        <!-- 剩餘數量顯示 -->
        <div class="text-sm sm:text-base text-gray-400 mb-5 sm:mb-8 text-right font-medium">
            剩餘可抽數量：<span id="remainingCount" class="font-bold text-indigo-400 text-base sm:text-lg">0</span> / <span id="totalCount" class="text-base sm:text-lg">0</span>
        </div>

        <!-- 抽籤結果顯示區 -->
        <div id="resultBox" class="bg-gray-900/90 border border-indigo-500/40 rounded-2xl p-6 sm:p-8 text-center mb-5 sm:mb-8 hidden shadow-inner">
            <p class="text-sm sm:text-base text-indigo-400 font-semibold mb-2 tracking-wider uppercase">🎉 抽中結果 🎉</p>
            <p class="text-lg sm:text-xl text-gray-300">箱子：<span id="resultBoxNum" class="font-bold text-2xl sm:text-3xl text-white">-</span></p>
            <p class="text-2xl sm:text-3xl font-black text-indigo-300 mt-2">品項：<span id="resultItem">-</span></p>
        </div>

        <!-- 按鈕區 -->
        <div class="flex gap-4 mt-auto">
            <button id="drawBtn" onclick="drawItem()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-4 sm:py-5 px-6 rounded-2xl transition shadow-lg text-lg sm:text-xl">
                開始抽籤
            </button>
            <button onclick="resetState()" class="bg-gray-700 hover:bg-gray-600 active:bg-gray-800 text-gray-200 font-semibold py-4 sm:py-5 px-6 rounded-2xl transition text-base sm:text-lg">
                重置
            </button>
        </div>

    </div>

    <script>
        // ================= 設定區域 =================
        const GITHUB_USER = "gamania31610";
        const REPO_NAME = "Random-Picker";
        // ===========================================

        // 每次進入網站自動重整機制（確保抓到最新檔案與避免快取）
        window.addEventListener('pageshow', function(event) {
            // 檢查是否為從瀏覽器快取（bfcache）恢復的頁面，或是全新進入
            const isReloaded = sessionStorage.getItem('has_reloaded');
            if (!isReloaded) {
                sessionStorage.setItem('has_reloaded', 'true');
                window.location.reload();
            }
        });

        // 離開頁面或關閉時清除標記，確保下次進來時會再次觸發重整
        window.addEventListener('beforeunload', function() {
            sessionStorage.removeItem('has_reloaded');
        });

        let currentData = []; 
        const jsonSelect = document.getElementById('jsonSelect');
        const remainingCountEl = document.getElementById('remainingCount');
        const totalCountEl = document.getElementById('totalCount');
        const resultBox = document.getElementById('resultBox');
        const resultBoxNum = document.getElementById('resultBoxNum');
        const resultItem = document.getElementById('resultItem');
        const drawBtn = document.getElementById('drawBtn');

        jsonSelect.addEventListener('change', loadSelectedJSON);

        window.onload = async function() {
            await fetchFileList();
        };

        async function fetchFileList() {
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/JSON`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('無法取得 GitHub 資料夾列表');
                const files = await response.json();

                const jsonFiles = files.filter(file => file.type === 'file' && file.name.endsWith('.json'));

                if (jsonFiles.length === 0) {
                    jsonSelect.innerHTML = '<option value="">JSON 資料夾內沒有找到檔案</option>';
                    return;
                }

                jsonSelect.innerHTML = '';
                jsonFiles.forEach((file) => {
                    const fileNameWithoutExt = file.name.replace('.json', '');
                    const option = document.createElement('option');
                    option.value = fileNameWithoutExt;
                    option.textContent = fileNameWithoutExt;
                    jsonSelect.appendChild(option);
                });

                loadSelectedJSON();

            } catch (error) {
                console.error(error);
                jsonSelect.innerHTML = '<option value="">載入清單失敗 (請確認 Repo 狀態)</option>';
            }
        }

        async function loadSelectedJSON() {
            const fileName = jsonSelect.value;
            if (!fileName) return;
            
            resultBox.classList.add('hidden');
            const url = `./JSON/${fileName}.json`;

            try {
                const response = await fetch(url + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error('讀取 JSON 失敗');
                const rawData = await response.json();

                const storageKey = `picker_${fileName}`;
                const savedStateJson = localStorage.getItem(storageKey);

                if (savedStateJson) {
                    const savedState = JSON.parse(savedStateJson);
                    const statusMap = {};
                    savedState.forEach(item => {
                        statusMap[`${item.箱子}_${item.品項}`] = item.被抽過;
                    });

                    currentData = rawData.map(newItem => {
                        const key = `${newItem.箱子}_${newItem.品項}`;
                        return {
                            ...newItem,
                            被抽過: statusMap[key] !== undefined ? statusMap[key] : false
                        };
                    });
                } else {
                    currentData = rawData.map(item => ({
                        ...item,
                        被抽過: false
                    }));
                }

                saveState();
                updateUI();

            } catch (error) {
                alert(`無法載入 JSON 檔案：${fileName}.json`);
                console.error(error);
                currentData = [];
                updateUI();
            }
        }

        function saveState() {
            const fileName = jsonSelect.value;
            if (fileName) {
                localStorage.setItem(`picker_${fileName}`, JSON.stringify(currentData));
            }
        }

        function updateUI() {
            const total = currentData.length;
            const remaining = currentData.filter(item => !item.被抽過).length;

            totalCountEl.textContent = total;
            remainingCountEl.textContent = remaining;

            if (remaining === 0 && total > 0) {
                drawBtn.textContent = "已抽完 (將自動重置)";
                drawBtn.classList.add('bg-gray-600', 'cursor-not-allowed');
                drawBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500', 'active:bg-indigo-700');
            } else {
                drawBtn.textContent = "開始抽籤";
                drawBtn.classList.remove('bg-gray-600', 'cursor-not-allowed');
                drawBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500', 'active:bg-indigo-700');
            }
        }

        function drawItem() {
            const availableItems = currentData.filter(item => !item.被抽過);

            if (availableItems.length === 0) {
                resetState();
                alert('所有品項都已經抽完了！已自動幫您重置所有狀態。');
                return;
            }

            const randomIndex = Math.floor(Math.random() * availableItems.length);
            const selected = availableItems[randomIndex];

            const target = currentData.find(item => item.箱子 === selected.箱子 && item.品項 === selected.品項);
            if (target) {
                target.被抽過 = true;
            }

            saveState();
            updateUI();

            resultBoxNum.textContent = selected.箱子;
            resultItem.textContent = selected.品項;
            resultBox.classList.remove('hidden');
        }

        function resetState() {
            currentData = currentData.map(item => ({
                ...item,
                被抽過: false
            }));
            saveState();
            updateUI();
            resultBox.classList.add('hidden');
        }
    </script>
</body>
</html>
